aid: eunice
name: Eunice
description: Eunice is a London-based AI fintech building institutional-grade due diligence
  and monitoring infrastructure for digital assets and private markets. Its platform automates
  token due diligence, classification, risk analysis, and disclosure requirements — including
  an AI-powered MiCA whitepaper library for streamlining compliance with the EU's Markets in
  Crypto-Assets Regulation — and delivers insights through a dashboard and API to exchanges,
  funds, custodians, issuers, and regulators. Founded in 2021 by Yi Luo, a second-time fintech
  entrepreneur and former VC, Eunice raised $8M in combined Seed and Pre-Seed funding led by
  Moonfire Ventures and Speedinvest with participation from Openspace Ventures in 2026, and
  counts Coinbase, Crypto.com, Copper, and Zodia Custody among its clients.
